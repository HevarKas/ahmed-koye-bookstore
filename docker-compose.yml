# Production on the shared server. The server's own Caddy (/etc/caddy/Caddyfile) serves
# https://ahmadkoye.com and forwards to 127.0.0.1:8083; see deploy/caddy-site.conf.
# Run with: docker compose -p ahmadkoye --env-file ../.env up -d --build
# (the GitHub deploy workflow does this automatically on every push to main).
services:
  website:
    build: .
    restart: unless-stopped
    environment:
      - SYNC_TOKEN=${SYNC_TOKEN}
    ports:
      - '127.0.0.1:8083:3000'
    volumes:
      # The synced book list lives here and survives rebuilds and restarts.
      - catalog-data:/data

volumes:
  catalog-data:
