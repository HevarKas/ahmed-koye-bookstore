services:
  website:
    container_name: ahmadkoye-website
    build: .
    restart: unless-stopped
    environment:
      - SYNC_TOKEN=${SYNC_TOKEN}
    volumes:
      # The synced book list lives here and survives rebuilds and restarts.
      - catalog-data:/data
    ports:
      - '127.0.0.1:3000:3000'

volumes:
  catalog-data:
