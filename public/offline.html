<!doctype html>
<html lang="ckb" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1F4D3F" />
    <title>ئینتەرنێت نییە — کتێبخانەی ئەحمەد کۆیی</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        font-family: 'Noto Sans Arabic', 'Segoe UI', Tahoma, sans-serif; background: #faf6ee; color: #1a2420;
        padding: 24px; box-sizing: border-box; text-align: center;
      }
      @media (prefers-color-scheme: dark) { body { background: #101412; color: #ece8df; } p { color: #a6a399 !important; } }
      .card { max-width: 380px; }
      img { width: 88px; height: 88px; border-radius: 20px; }
      h1 { font-size: 1.4rem; margin: 22px 0 8px; }
      p { margin: 0 0 24px; line-height: 1.9; color: #5e655f; }
      button, a {
        display: inline-flex; align-items: center; justify-content: center; height: 46px; padding: 0 22px; border-radius: 999px;
        font: inherit; font-weight: 600; text-decoration: none; cursor: pointer; border: 0; margin: 4px;
      }
      button { background: #1f4d3f; color: #fff; }
      a { background: transparent; color: inherit; border: 1px solid #d8d2c4; }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/icons/icon-192.png" alt="" />
      <h1>پەیوەندی بە ئینتەرنێتەوە نییە</h1>
      <p>ئەم پەڕەیە هێشتا پاشەکەوت نەکراوە. کاتێک ئینتەرنێت گەڕایەوە دووبارە هەوڵ بدەرەوە.<br />ئەو پەڕانەی پێشتر سەیرت کردوون بێ ئینتەرنێتیش دەکرێنەوە.</p>
      <button type="button" onclick="location.reload()">دووبارە هەوڵ بدەرەوە</button>
      <a href="/list">لیستەکەم</a>
    </div>
  </body>
</html>
